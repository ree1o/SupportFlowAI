name: M1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: supportflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow -d supportflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://supportflow:ci_password@localhost:5432/supportflow_test
      SUPPORTFLOW_DATABASE_URL: postgresql+psycopg://supportflow:ci_password@localhost:5432/supportflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: alembic upgrade head
      - run: alembic check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check API and same-origin frontend proxy
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:5173/
          curl --fail http://localhost:8000/api/health/live
          curl --fail http://localhost:5173/api/health/ready
      - name: Check database outage behavior
        run: |
          docker compose stop db
          curl --fail http://localhost:8000/api/health/live
          status=$(curl --silent --output /tmp/readiness.json --write-out '%{http_code}' http://localhost:8000/api/health/ready)
          test "$status" = 503
          docker compose start db
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8000/api/health/ready
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
