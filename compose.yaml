name: supportflow

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  environment: &backend-environment
    SUPPORTFLOW_DATABASE_URL: postgresql+psycopg://supportflow_runtime:${SUPPORTFLOW_RUNTIME_DB_PASSWORD:-supportflow_runtime_dev_only}@db:5432/${POSTGRES_DB:-supportflow}
    SUPPORTFLOW_ENVIRONMENT: ${SUPPORTFLOW_ENVIRONMENT:-development}
    SUPPORTFLOW_LOG_LEVEL: ${SUPPORTFLOW_LOG_LEVEL:-INFO}
    SUPPORTFLOW_COOKIE_SECURE: ${SUPPORTFLOW_COOKIE_SECURE:-false}
    SUPPORTFLOW_ALLOWED_ORIGINS: ${SUPPORTFLOW_ALLOWED_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    SUPPORTFLOW_REDIS_URL: redis://redis:6379/0
    SUPPORTFLOW_SMTP_HOST: mailpit
    SUPPORTFLOW_SMTP_PORT: 1025
    SUPPORTFLOW_SEMANTIC_MODEL_CACHE_DIR: /var/cache/supportflow/models
    HF_HOME: /var/cache/supportflow/models/.huggingface
    SUPPORTFLOW_SEMANTIC_INDEX_BATCH_SIZE: ${SUPPORTFLOW_SEMANTIC_INDEX_BATCH_SIZE:-50}
    SUPPORTFLOW_SEMANTIC_INDEX_MAX_ATTEMPTS: ${SUPPORTFLOW_SEMANTIC_INDEX_MAX_ATTEMPTS:-5}
    SUPPORTFLOW_SEMANTIC_MIN_SIMILARITY: ${SUPPORTFLOW_SEMANTIC_MIN_SIMILARITY:-0.35}
    SUPPORTFLOW_EMAIL_FROM: ${SUPPORTFLOW_EMAIL_FROM:-support@supportflow.local}
    SUPPORTFLOW_PUBLIC_APP_URL: ${SUPPORTFLOW_PUBLIC_APP_URL:-http://localhost:5173}
    SUPPORTFLOW_RADAR_LOOKBACK_HOURS: ${SUPPORTFLOW_RADAR_LOOKBACK_HOURS:-72}
    SUPPORTFLOW_RADAR_PAIR_WINDOW_MINUTES: ${SUPPORTFLOW_RADAR_PAIR_WINDOW_MINUTES:-360}
    SUPPORTFLOW_RADAR_SIMILARITY_THRESHOLD: ${SUPPORTFLOW_RADAR_SIMILARITY_THRESHOLD:-0.30}
    SUPPORTFLOW_RADAR_MIN_SHARED_TERMS: ${SUPPORTFLOW_RADAR_MIN_SHARED_TERMS:-2}
    SUPPORTFLOW_RADAR_MAX_TICKETS: ${SUPPORTFLOW_RADAR_MAX_TICKETS:-500}
    SUPPORTFLOW_RADAR_MAX_CANDIDATE_PAIRS: ${SUPPORTFLOW_RADAR_MAX_CANDIDATE_PAIRS:-50000}
    SUPPORTFLOW_TOKEN_ENCRYPTION_KEY: ${SUPPORTFLOW_TOKEN_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportflow_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-supportflow}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
      SUPPORTFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportflow}:${POSTGRES_PASSWORD:-supportflow_dev_only}@db:5432/${POSTGRES_DB:-supportflow}
      SUPPORTFLOW_RUNTIME_DB_PASSWORD: ${SUPPORTFLOW_RUNTIME_DB_PASSWORD:-supportflow_runtime_dev_only}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      FORWARDED_ALLOW_IPS: ${SUPPORTFLOW_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - app.jobs.celery_app
      - worker
      - --beat
      - --schedule=/tmp/supportflow-celerybeat
      - --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - semantic_model_cache:/var/cache/supportflow/models
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  semantic_model_cache:
